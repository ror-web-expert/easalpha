# EasAlpha, complete stack: PostgreSQL, API, job worker, web app, WhatsApp gateway. Put a TLS proxy (Caddy, nginx) in
# front of web:3000 and api:3001, or set FORCE_SSL=false for a plain LAN install.
# Overlays: docker-compose.images.yml (prebuilt images from GitHub), docker-compose.proxy.yml (Caddy already in Docker).
# List them in COMPOSE_FILE inside .env and every "docker compose" command picks them up.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }

  api:
    build: ../easalpha-api
    restart: unless-stopped
    command: bash -c "bin/rails db:prepare && bin/rails db:seed && bin/rails server -b 0.0.0.0 -p 3001"
    environment: &api_env
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      FORCE_SSL: ${FORCE_SSL:-true}
      PUBLIC_URL: ${PUBLIC_URL}
      CORS_ORIGINS: ${PUBLIC_URL}
      # Puma threads (and the database pool): bill runs and PDF exports hold a thread for a while.
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      WHATSAPP_GATEWAY_URL: http://whatsapp:3010
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@example.pk}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
      MAIL_FROM: ${MAIL_FROM:-EasAlpha <no-reply@easalpha.com>}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-hello@easalpha.com}
    depends_on: { db: { condition: service_healthy } }
    ports: ["3001:3001"]
    volumes: ["storage:/rails/storage"]

  jobs:
    build: ../easalpha-api
    restart: unless-stopped
    command: bin/jobs
    environment: *api_env
    depends_on: [api]
    volumes: ["storage:/rails/storage"]

  web:
    restart: unless-stopped
    build:
      context: ../easalpha-web
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL}/api/v1
        NEXT_PUBLIC_CABLE_URL: ${API_PUBLIC_URL}/cable
    environment:
      # Cookieless analytics on the public site, served to the browser by /api/analytics: ANALYTICS_PROVIDER=umami with the website id
      # in ANALYTICS_ID, or plausible with the site domain. Empty means no tracker is loaded. See docs/DEPLOY.md.
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-}
      ANALYTICS_ID: ${ANALYTICS_ID:-}
      ANALYTICS_SRC: ${ANALYTICS_SRC:-}
      # Where the web container reaches the self-hosted Umami for the /stats proxy (next.config.ts rewrites).
      UMAMI_INTERNAL_URL: http://umami:3000
    ports: ["3000:3000"]
    # Desktop installers for the Download page: drop the files from a desktop release into deploy/downloads/ and the
    # site serves them at /downloads, so the links follow the site's own domain.
    volumes: ["./downloads:/app/public/downloads:ro"]
    depends_on: [api]

  whatsapp:
    build: ../easalpha-whatsapp
    restart: unless-stopped
    environment:
      PORT: "3010"
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
    volumes: ["wasessions:/app/sessions"]

  # Self-hosted Umami, the public site's analytics, built with BASE_PATH=/stats so the web container can proxy it at
  # easalpha.com/stats (dashboard, tracker script and collector, all first-party: no DNS, certificate or Caddy change,
  # and ad blockers leave it alone). It keeps its own database in the same PostgreSQL; umami-db-init creates it once.
  umami-db-init:
    image: postgres:16
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c", "psql -h db -U postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='umami'\" | grep -q 1 || psql -h db -U postgres -c 'CREATE DATABASE umami'"]
    depends_on: { db: { condition: service_healthy } }

  umami:
    build:
      context: https://github.com/umami-software/umami.git#v3.4.0
      args:
        BASE_PATH: /stats
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  storage:
  wasessions:
