# EasAlpha, complete stack: PostgreSQL, API, job worker, web app, WhatsApp gateway. Put a TLS proxy (Caddy, nginx) in
# front of web:3000 and api:3001, or set FORCE_SSL=false for a plain LAN install.
# Overlays: docker-compose.images.yml (prebuilt images from GitHub), docker-compose.tunnel.yml (Cloudflare Tunnel and
# Caddy, for a server nothing on the internet reaches: production since 26 Nov 2026), docker-compose.caddy.yml (Caddy
# on 80/443, a server with its own address), docker-compose.proxy.yml (another Caddy already in Docker).
# List them in COMPOSE_FILE inside .env and every "docker compose" command picks them up.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }

  # Runs to completion before the API, the job worker and the WhatsApp gateway start, at every "up": those images run
  # as uid 1000 (rails, node), and a storage or wasessions volume an older root image made is owned by root, so
  # uploads, logos, bill PDFs and the linked WhatsApp phone failed with "permission denied" (6 Nov 2026 review, R32).
  # chown is idempotent; on a volume already owned it changes nothing. "docker compose ps -a" shows it Exited (0).
  volume-owner:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    network_mode: none
    entrypoint: ["chown", "-R", "1000:1000", "/rails/storage", "/app/sessions"]
    volumes:
      - "storage:/rails/storage"
      - "wasessions:/app/sessions"

  api:
    build: ../easalpha-api
    restart: unless-stopped
    # bin/start: migrations, seeds and the Row-Level Security policies, then Puma (as the easalpha_app role when
    # EASALPHA_APP_DB_PASSWORD is set, so the policies apply; a superuser ignores them). Unset, every start prints a
    # WARNING and /api/v1/health answers "rls": false (docs/DEPLOY.md, "Row-Level Security").
    command: bin/start api
    environment: &api_env
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      EASALPHA_APP_DB_PASSWORD: ${EASALPHA_APP_DB_PASSWORD:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      FORCE_SSL: ${FORCE_SSL:-true}
      PUBLIC_URL: ${PUBLIC_URL}
      CORS_ORIGINS: ${PUBLIC_URL}
      # Puma threads (and the database pool): bill runs and PDF exports hold a thread for a while.
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      WHATSAPP_GATEWAY_URL: http://whatsapp:3010
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@example.pk}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
      MAIL_FROM: ${MAIL_FROM:-EasAlpha <no-reply@easalpha.com>}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-hello@easalpha.com}
    depends_on:
      db: { condition: service_healthy }
      volume-owner: { condition: service_completed_successfully }
    ports: ["3001:3001"]
    volumes: ["storage:/rails/storage"]

  jobs:
    build: ../easalpha-api
    restart: unless-stopped
    command: bin/start jobs
    environment: *api_env
    depends_on:
      api: { condition: service_started }
      volume-owner: { condition: service_completed_successfully }
    volumes: ["storage:/rails/storage"]

  web:
    restart: unless-stopped
    build:
      context: ../easalpha-web
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL}/api/v1
        NEXT_PUBLIC_CABLE_URL: ${API_PUBLIC_URL}/cable
    environment:
      # Cookieless analytics on the public site, served to the browser by /api/analytics: ANALYTICS_PROVIDER=umami with the website id
      # in ANALYTICS_ID, or plausible with the site domain. Empty means no tracker is loaded. See docs/DEPLOY.md.
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-}
      ANALYTICS_ID: ${ANALYTICS_ID:-}
      ANALYTICS_SRC: ${ANALYTICS_SRC:-}
      # Where the web container reaches the self-hosted Umami for the /stats proxy (next.config.ts rewrites).
      UMAMI_INTERNAL_URL: http://umami:3000
    ports: ["3000:3000"]
    # Desktop installers for the Download page: drop the files from a desktop release into deploy/downloads/ and the
    # site serves them at /downloads, so the links follow the site's own domain.
    volumes: ["./downloads:/app/public/downloads:ro"]
    depends_on: [api]

  whatsapp:
    build: ../easalpha-whatsapp
    restart: unless-stopped
    environment:
      PORT: "3010"
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
    depends_on: { volume-owner: { condition: service_completed_successfully } }
    volumes: ["wasessions:/app/sessions"]

  # Nightly backup of the database, uploads and linked WhatsApp phones into ./backups (BACKUP_DIR), kept BACKUP_KEEP_DAYS.
  # One-off: docker compose run --rm backup now. Restore steps: docs/DEPLOY.md. Copy the folder off the server with the
  # host cron in docs/DEPLOY.md ("Backup"): a backup on the same disk is only half a backup, and the shared server took
  # its backups down with it in Nov 2026. BACKUP_COPY_CMD runs in this postgres:16 container, which has no rclone,
  # rsync, ssh or curl, so it cannot do that copy.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-easalpha_production}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_COPY_CMD: ${BACKUP_COPY_CMD:-}
      TZ: ${TZ:-Asia/Karachi}
    volumes:
      - "${BACKUP_DIR:-./backups}:/backups"
      - "./backup.sh:/backup.sh:ro"
      - "storage:/data/storage:ro"
      - "wasessions:/data/wasessions:ro"
    entrypoint: ["sh", "/backup.sh"]
    depends_on: { db: { condition: service_healthy } }

  # Self-hosted Umami, the public site's analytics, built with BASE_PATH=/stats so the web container can proxy it at
  # easalpha.com/stats (dashboard, tracker script and collector, all first-party: no DNS, certificate or Caddy change,
  # and ad blockers leave it alone). It keeps its own database in the same PostgreSQL; umami-db-init creates it once.
  umami-db-init:
    image: postgres:16
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c", "psql -h db -U postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='umami'\" | grep -q 1 || psql -h db -U postgres -c 'CREATE DATABASE umami'"]
    depends_on: { db: { condition: service_healthy } }

  umami:
    build:
      context: https://github.com/umami-software/umami.git#v3.4.0
      args:
        BASE_PATH: /stats
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  storage:
  wasessions:
