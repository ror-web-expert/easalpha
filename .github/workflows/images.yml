# Build and deploy. On every push to main/master (and every v* tag):
#   1. build: Docker images for the API, web app and WhatsApp gateway, pushed to GitHub Container Registry as
#      ghcr.io/<owner>/easalpha-api, easalpha-web, easalpha-whatsapp. Tags: "latest" (branch), the git tag (releases), the short SHA.
#      The web image bakes in the API address: repository variable API_PUBLIC_URL (Settings > Secrets and variables >
#      Actions > Variables), e.g. https://api.easalpha.com.
#   2. deploy: over SSH, copies deploy/ to the server, logs the server into ghcr.io with this run's token, pulls the new
#      images (three tries of at most 15 minutes each; the server's .env keeps naming the running images until every
#      new one is there, so a stalled pull leaves the site as it was), then restarts the stack (migrations and seeds run
#      on API start), waits for the API health check and removes EasAlpha images older than the previous release.
#      Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key whose public half is in the server's
#      ~/.ssh/authorized_keys). Optional DEPLOY_PATH (default ~/easalpha). scripts/github-setup.sh sets all of these.
#      No DEPLOY_HOST secret: images are built and the deploy step is skipped.
name: images
# 29 Oct 2026: a push to main no longer deploys by itself. The "ci" workflow runs first and this one starts when it has
# finished (workflow_run); the build is skipped unless ci passed, so a red test suite never reaches the server. Tags
# and manual runs still build directly.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, master]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: { contents: read, packages: write }

# The commit being built: the one ci tested, or the tag or branch head for a direct run.
env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: easalpha-api, build_args: "" }
          - { name: web, context: easalpha-web, build_args: "" }
          - { name: whatsapp, context: easalpha-whatsapp, build_args: "" }
          # Self-hosted analytics, built from Umami's own repository at a pinned tag with the /stats base path
          # (deploy/docker-compose.yml, next.config.ts rewrites). A git URL is a valid build context for buildx.
          - { name: umami, context: "https://github.com/umami-software/umami.git#v3.4.0", build_args: "BASE_PATH=/stats" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.HEAD_SHA }}" }
      - id: sha
        run: echo "short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/easalpha-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=${{ steps.sha.outputs.short }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ${{ matrix.build_args }}
            NEXT_PUBLIC_API_URL=${{ vars.API_PUBLIC_URL || 'https://api.example.pk' }}/api/v1
            NEXT_PUBLIC_CABLE_URL=${{ vars.API_PUBLIC_URL || 'https://api.example.pk' }}/cable
            NEXT_PUBLIC_ANALYTICS_PROVIDER=${{ vars.ANALYTICS_PROVIDER || '' }}
            NEXT_PUBLIC_ANALYTICS_ID=${{ vars.ANALYTICS_ID || '' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    concurrency: { group: deploy-production, cancel-in-progress: false }
    # 18 Oct 2026: a pull stalled on the server and the job hung for 2 h 13 m until the SSH connection dropped.
    timeout-minutes: 60
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/easalpha' }}
    steps:
      - if: ${{ env.DEPLOY_HOST == '' }}
        run: echo "DEPLOY_HOST secret not set; images are on ghcr.io, nothing deployed."
      - if: ${{ env.DEPLOY_HOST != '' }}
        uses: actions/checkout@v4
        with: { sparse-checkout: deploy, sparse-checkout-cone-mode: false }
      - if: ${{ env.DEPLOY_HOST != '' }}
        name: SSH key
        env: { DEPLOY_SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}" }
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # The server is sometimes briefly unreachable: try the key scan a few times before giving up.
          for i in 1 2 3 4 5; do ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null; test -s ~/.ssh/known_hosts && break; sleep 10; done
          # Keep-alives: a connection that stops answering ends after 3 minutes instead of hanging the job.
          echo "Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
            ServerAliveCountMax 6
            ConnectTimeout 30" > ~/.ssh/config
      - if: ${{ env.DEPLOY_HOST != '' }}
        name: Copy compose files (never .env or downloads)
        run: |
          ssh server "mkdir -p $DEPLOY_PATH/downloads"
          rsync -av --exclude '.env' --exclude 'downloads' --exclude '.env.example' deploy/ "server:$DEPLOY_PATH/"
      - if: ${{ env.DEPLOY_HOST != '' }}
        name: Pull images and restart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ env.HEAD_SHA }}
        run: |
          REPO="ghcr.io/${OWNER,,}/easalpha"; TAG="${SHA:0:7}"
          ssh server "set -e
            cd $DEPLOY_PATH
            test -f .env || { echo '.env missing on the server: copy deploy/.env.example to $DEPLOY_PATH/.env and fill it in'; exit 1; }
            echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
            # Pull first, naming the new images only in this shell: .env still names the running ones, so nothing
            # changes on the server until every new image is here.
            ok=
            for n in 1 2 3; do
              if IMAGE_REPO=$REPO IMAGE_TAG=$TAG timeout 900 docker compose pull --quiet; then ok=1; break; fi
              echo \"Pull attempt \$n failed or took over 15 minutes, trying again\"; sleep 20
            done
            test -n \"\$ok\" || { echo 'Could not pull the new images; the running version was left as it was'; exit 1; }
            PREV=\$(docker inspect -f '{{.Config.Image}}' \$(docker compose ps -q api) 2>/dev/null | sed 's/.*://' || true)
            sed -i -e 's#^IMAGE_REPO=.*#IMAGE_REPO=$REPO#' -e 's#^IMAGE_TAG=.*#IMAGE_TAG=$TAG#' .env
            grep -q '^IMAGE_REPO=' .env || echo 'IMAGE_REPO=$REPO' >> .env
            grep -q '^IMAGE_TAG=' .env || echo 'IMAGE_TAG=$TAG' >> .env
            docker compose up -d --remove-orphans
            echo 'Waiting for the API...'
            healthy=
            for i in \$(seq 1 60); do
              if docker compose exec -T api curl -fsS http://localhost:3001/api/v1/health >/dev/null 2>&1; then healthy=1; break; fi
              sleep 5
            done
            test -n \"\$healthy\" || { echo 'API did not become healthy in 5 minutes'; docker compose logs --tail=100 api; exit 1; }
            echo \"API healthy on $TAG (previous release \$PREV)\"
            # Keep this release and the one before it for a rollback; older EasAlpha images only fill the disk
            # (72 of them had taken it to 87% by 18 Oct 2026).
            docker images --format '{{.Repository}}:{{.Tag}}' | grep '^$REPO-' | grep -v -e ':$TAG\$' -e \":\$PREV\\\$\" | xargs -r docker rmi >/dev/null 2>&1 || true
            docker image prune -f >/dev/null"
