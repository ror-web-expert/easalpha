# Tests on every push and pull request: API specs against PostgreSQL, web lint/typecheck/unit tests, desktop unit tests.
name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5434:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: servio-api } }
    env: { RAILS_ENV: test, PGHOST: localhost, PGPORT: "5434", PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: 3.3.4, bundler-cache: true, working-directory: servio-api }
      - run: bin/rails db:create db:schema:load
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - run: bundle exec brakeman -q --no-pager

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: servio-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.27.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: servio-web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  desktop:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: servio-desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.27.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: servio-desktop/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
