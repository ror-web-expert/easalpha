default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", "5434") %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV.fetch("PGPASSWORD", "postgres") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: servio_development
  queue:
    <<: *default
    database: servio_development_queue
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
    database: servio_development_cache
    migrations_paths: db/cache_migrate
  cable:
    <<: *default
    database: servio_development_cable
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: servio_test

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "servio_production") %>
  queue:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "servio_production") %>_queue
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "servio_production") %>_cache
    migrations_paths: db/cache_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "servio_production") %>_cable
    migrations_paths: db/cable_migrate
